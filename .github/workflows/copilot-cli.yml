name: Copilot CLI Run
on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: copilot-cli-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  run-copilot:
    environment: copilot
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update -y \
            && sudo apt-get install -y --no-install-recommends curl tar gzip ca-certificates \
            && sudo rm -rf /var/lib/apt/lists/*

      - name: Install Copilot CLI (official installer) — safer
        run: |
          # Download installer instead of piping to sudo bash directly
          curl -fsSL -o /tmp/copilot-install.sh https://gh.io/copilot-install
          # Optional: verify checksum if available (replace <expected-sha256> or use a secret)
          # echo "<expected-sha256>  /tmp/copilot-install.sh" | sha256sum -c - || (echo "checksum mismatch" && exit 1)
          chmod +x /tmp/copilot-install.sh
          sudo /tmp/copilot-install.sh || true
          copilot --version || true

      - name: Copilot diagnostic info
        run: |
          echo "== copilot binary =="
          if command -v copilot >/dev/null 2>&1; then
            echo "copilot found at: $(command -v copilot)"
            copilot --version || echo "copilot --version failed"
            ls -l "$(command -v copilot)" || true
          else
            echo "copilot binary not found"
          fi

          echo "== environment (presence only) =="
          if [ -n "${COPILOT_GITHUB_TOKEN:-}" ]; then echo "COPILOT_GITHUB_TOKEN is set"; else echo "COPILOT_GITHUB_TOKEN is NOT set"; fi
          if [ -n "${GH_TOKEN:-}" ]; then echo "GH_TOKEN is set"; else echo "GH_TOKEN is NOT set"; fi
          if [ -n "${GITHUB_TOKEN:-}" ]; then echo "GITHUB_TOKEN is set"; else echo "GITHUB_TOKEN is NOT set"; fi

          echo "== copilot auth check =="
          copilot auth status 2>&1 || echo "copilot auth status not available or failed (nonfatal)"

          echo "== repository checks =="
          if [ -f src/App.jsx ]; then echo "src/App.jsx exists"; else echo "src/App.jsx missing"; fi
          echo "Working directory listing (truncated):"
          ls -la | sed -n '1,200p'

      - name: Authenticate Copilot CLI (non-interactive)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          # The CLI will use COPILOT_GITHUB_TOKEN/GH_TOKEN/GITHUB_TOKEN for non-interactive auth
          if command -v copilot >/dev/null 2>&1; then
            copilot auth login --token "$COPILOT_GITHUB_TOKEN" || true
          fi

      - name: Run Copilot CLI task (example)
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot code --file src/App.jsx --prompt "Suggest a small refactor to improve readability" --output suggestions.txt
          echo "Suggestions saved to suggestions.txt"
